project_id = "stayboost-guest-flow"

# Gästsidan är publik — guest_token i länken är nyckeln, ingen JWT krävs.
[functions.guest-page]
verify_jwt = false

# iCal-exportflödet är publikt — kanalerna pollar det utan JWT,
# enhetens feed-token i länken är nyckeln.
[functions.ical-export]
verify_jwt = false

# Bokningsmotorn är publik — anläggningens slug är adressen,
# känsliga operationer (överlapp, pris) sker server-side.
[functions.booking-engine]
verify_jwt = false

# Sirvoys webhook postar hit utan JWT — token i länken är nyckeln.
[functions.sirvoy-webhook]
verify_jwt = false

# Stripe postar hit utan JWT — HMAC-signaturen i Stripe-Signature-headern
# verifieras mot STRIPE_WEBHOOK_SECRET i funktionen.
[functions.stripe-webhook]
verify_jwt = false

# Chatt-widgeten är publik — slugen identifierar anläggningen,
# honeypot + återkomst-spärr skyddar mot spam.
[functions.chat-message]
verify_jwt = false

# Återbetalning och manuella Swish-övergångar kräver inloggad ägare.
[functions.stripe-refund]
verify_jwt = true

[functions.payment-action]
verify_jwt = true

# StayBoost-abonnemang: kundens actions kräver inloggning. Den separata
# Stripe-webhooken verifieras med SAAS_STRIPE_WEBHOOK_SECRET i funktionskoden.
[functions.saas-billing]
verify_jwt = true

[functions.saas-stripe-webhook]
verify_jwt = false

# Cron-anrop saknar användar-JWT och måste nå funktionskoden så att
# x-cron-secret kan verifieras där. ical-sync behåller dessutom egen
# användar-JWT-validering för manuella synkar från operator-UI:t.
[functions.ical-sync]
verify_jwt = false

[functions.send-scheduled-messages]
verify_jwt = false

# Endast server-till-server via x-cron-secret.
[functions.ops-cron]
verify_jwt = false
