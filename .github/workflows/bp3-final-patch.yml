name: BP3 final patch

on:
  push:
    branches:
      - chatgpt/bp3-payment-lifecycle

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/bp3-payment-lifecycle
      - name: Add Stripe minimum-expiry safety margin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/booking-engine/index.ts')
          s = p.read_text()
          old = 'const STRIPE_HOLD_SECONDS = 30 * 60;'
          new = '// Stripe requires Checkout expiry to be at least 30 minutes from session creation.\n// Use 31 minutes so DB work before the API call cannot push us below that minimum.\nconst STRIPE_HOLD_SECONDS = 31 * 60;'
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path('supabase/functions/_shared/stripe.ts')
          s = p.read_text()
          old = 'const expiresAt = p.expiresAtUnix ?? Math.floor(Date.now() / 1000) + 30 * 60;'
          new = 'const expiresAt = p.expiresAtUnix ?? Math.floor(Date.now() / 1000) + 31 * 60;'
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          bunx prettier --write supabase/functions/booking-engine/index.ts supabase/functions/_shared/stripe.ts || true
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/booking-engine/index.ts supabase/functions/_shared/stripe.ts
          git commit -m "fix(payments): keep Stripe hold above minimum expiry"
          git push origin HEAD:chatgpt/bp3-payment-lifecycle
