name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (no new errors)
        run: |
          bunx eslint . --format json > eslint-report.json || true
          bun scripts/verify-eslint-baseline.mjs

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun run test

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check guest page function
        run: deno check supabase/functions/guest-page/index.ts

      - name: Check booking and channel functions
        run: >-
          deno check
          supabase/functions/booking-import/index.ts
          supabase/functions/ical-export/index.ts
          supabase/functions/booking-reconcile/index.ts
          supabase/functions/sirvoy-archive/index.ts
          supabase/functions/sirvoy-records/index.ts
          supabase/functions/booking-engine/index.ts
          supabase/functions/payment-action/index.ts
          supabase/functions/stripe-webhook/index.ts
          supabase/functions/stripe-refund/index.ts
          supabase/functions/channel-sync/index.ts
          supabase/functions/channex-webhook/index.ts
          supabase/functions/send-scheduled-messages/index.ts

      - name: Check Guest AI function
        run: deno check supabase/functions/guest-ai-draft/index.ts

      - name: Build
        run: bun run build
