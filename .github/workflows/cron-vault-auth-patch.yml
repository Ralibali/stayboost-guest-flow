name: Cron Vault auth patch once

on:
  push:
    branches:
      - chatgpt/production-cron-vault-auth

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/production-cron-vault-auth
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Patch cron auth
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              assert old in s, f"missing block in {path}"
              p.write_text(s.replace(old, new, 1))

          # ops-cron
          replace(
              'supabase/functions/ops-cron/index.ts',
              'import { createClient } from "https://esm.sh/@supabase/supabase-js@2";\n',
              'import { createClient } from "https://esm.sh/@supabase/supabase-js@2";\nimport { isCronAuthorized } from "../_shared/cron-auth.ts";\n',
          )
          replace(
              'supabase/functions/ops-cron/index.ts',
              '''  const secret = req.headers.get("x-cron-secret") ?? "";\n  const expected = Deno.env.get("CRON_SECRET") ?? "";\n  if (!expected || secret !== expected) return json({ error: "unauthorized" }, 401);\n\n  const admin = createClient(\n    Deno.env.get("SUPABASE_URL")!,\n    Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")!,\n  );\n''',
              '''  const secret = req.headers.get("x-cron-secret") ?? "";\n  const admin = createClient(\n    Deno.env.get("SUPABASE_URL")!,\n    Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")!,\n  );\n  if (!(await isCronAuthorized(admin, secret))) {\n    return json({ error: "unauthorized" }, 401);\n  }\n''',
          )

          # send-scheduled-messages
          replace(
              'supabase/functions/send-scheduled-messages/index.ts',
              'import { createClient } from "https://esm.sh/@supabase/supabase-js@2";\n',
              'import { createClient } from "https://esm.sh/@supabase/supabase-js@2";\nimport { isCronAuthorized } from "../_shared/cron-auth.ts";\n',
          )
          replace(
              'supabase/functions/send-scheduled-messages/index.ts',
              '''  const secret = req.headers.get("x-cron-secret");\n  const expected = Deno.env.get("CRON_SECRET");\n  if (!expected || secret !== expected) return json({ error: "unauthorized" }, 401);\n\n  const admin = createClient(\n    Deno.env.get("SUPABASE_URL")!,\n    Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")!,\n  );\n''',
              '''  const secret = req.headers.get("x-cron-secret");\n  const admin = createClient(\n    Deno.env.get("SUPABASE_URL")!,\n    Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")!,\n  );\n  if (!(await isCronAuthorized(admin, secret))) {\n    return json({ error: "unauthorized" }, 401);\n  }\n''',
          )

          # ical-sync keeps owner JWT fallback for manual operator syncs.
          replace(
              'supabase/functions/ical-sync/index.ts',
              'import { createClient } from "https://esm.sh/@supabase/supabase-js@2";\n',
              'import { createClient } from "https://esm.sh/@supabase/supabase-js@2";\nimport { isCronAuthorized } from "../_shared/cron-auth.ts";\n',
          )
          replace(
              'supabase/functions/ical-sync/index.ts',
              '''  let ownerFilter: string | null = null;\n  const cronSecret = req.headers.get("x-cron-secret");\n  const expected = Deno.env.get("CRON_SECRET");\n  if (!expected || cronSecret !== expected) {\n''',
              '''  let ownerFilter: string | null = null;\n  const cronSecret = req.headers.get("x-cron-secret");\n  if (!(await isCronAuthorized(admin, cronSecret))) {\n''',
          )
          PY
          bunx prettier --write supabase/functions/ops-cron/index.ts supabase/functions/send-scheduled-messages/index.ts supabase/functions/ical-sync/index.ts supabase/functions/_shared/cron-auth.ts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/ops-cron/index.ts supabase/functions/send-scheduled-messages/index.ts supabase/functions/ical-sync/index.ts supabase/functions/_shared/cron-auth.ts
          git commit -m "fix(cron): validate Vault-backed runtime secret"
          git push origin HEAD:chatgpt/production-cron-vault-auth
