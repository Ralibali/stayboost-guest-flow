name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package-lock.json var redan ur synk på main (lru-cache@11.5.2 saknas).
      # npm install verifierar därför koden utan att blockeras av den äldre lockfilen.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
